name: Localize Talal images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-talal-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download remaining provided images locally
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          files = {
              'https://tarkeb-zoogag.com/wp-content/uploads/2024/08/شركة-تركيب-زجاج-سيكوريت-بالمدينة-المنورة-2.webp': Path('public/assets/talal/shops-glass-2.webp'),
              'https://tarkeb-zoogag.com/wp-content/uploads/2024/08/شركة-تركيب-زجاج-سيكوريت-بالمدينة-المنورة-26.webp': Path('public/assets/talal/offices-glass-26.webp'),
          }

          for url, target in files.items():
              encoded = quote(url, safe=':/')
              req = Request(encoded, headers={'User-Agent': 'Mozilla/5.0'})
              with urlopen(req, timeout=60) as response:
                  data = response.read()
              if len(data) < 10000 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise RuntimeError(f'Invalid WebP downloaded from {url}: {len(data)} bytes')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f'Saved {target} ({len(data)} bytes)')
          PY

      - name: Point homepage gallery and service pages to local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Homepage: replace the last two remote gallery images with local copies.
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'https://tarkeb-zoogag.com/wp-content/uploads/2024/08/شركة-تركيب-زجاج-سيكوريت-بالمدينة-المنورة-2.webp': '/assets/talal/shops-glass-2.webp',
              'https://tarkeb-zoogag.com/wp-content/uploads/2024/08/شركة-تركيب-زجاج-سيكوريت-بالمدينة-المنورة-26.webp': '/assets/talal/offices-glass-26.webp',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise RuntimeError(f'Expected homepage source URL not found: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Service pages: keep all written content intact and replace only image src values.
          service_images = {
              'app/services/offices-glass/page.tsx': '/assets/talal/offices-glass-26.webp',
              'app/services/shops-glass/page.tsx': '/assets/talal/shops-glass-2.webp',
              'app/services/shower-glass/page.tsx': '/assets/talal/glass-securit-19.webp',
              'app/services/pools-glass/page.tsx': '/assets/talal/pools-glass-2.webp',
              'app/services/railing-glass/page.tsx': '/assets/talal/railing-glass-19.webp',
              'app/services/doors-glass/page.tsx': '/assets/talal/shops-glass-2.webp',
              'app/services/maintenance-glass/page.tsx': '/assets/talal/glass-securit-19.webp',
          }

          pattern = re.compile(r'src="https://tarkeb-zoogag\.com/wp-content/[^"]+\.webp"')
          for filename, local_src in service_images.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              new_text, count = pattern.subn(f'src="{local_src}"', text)
              if count < 1:
                  raise RuntimeError(f'No remote service image found in {filename}')
              path.write_text(new_text, encoding='utf-8')
              print(f'Updated {filename}: {count} image reference(s)')
          PY

      - name: Verify all site images are self-hosted
        run: |
          if grep -RIn --exclude-dir=.git --exclude='package-lock.json' -E 'res\.cloudinary\.com|cloudinary|/wp-content/' app components lib public next.config.ts 2>/dev/null; then
            echo 'External image dependency still found.'
            exit 1
          fi

      - name: Build check
        run: |
          npm ci
          npm run build

      - name: Commit localized assets
        run: |
          rm -f .github/workflows/localize-talal-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: self-host all Talal site images'
          git push
