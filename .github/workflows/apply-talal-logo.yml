name: Apply Talal transparent logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-talal-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update logo references and favicon
        run: |
          python - <<'PY'
          from pathlib import Path

          old_abs = 'https://tarkeb-zoogag.com/assets/talal/logo.webp'
          new_abs = 'https://tarkeb-zoogag.com/assets/talal/logo-transparent.webp'

          # Update all SEO/schema references without changing text content.
          for root in ['app', 'components', 'lib']:
              base = Path(root)
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx', '.js', '.jsx', '.json'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  new_text = text.replace(old_abs, new_abs)
                  if new_text != text:
                      path.write_text(new_text, encoding='utf-8')

          # Header/footer: use the local transparent file and remove the forced white box.
          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace(new_abs, '/assets/talal/logo-transparent.webp')
          text = text.replace('bg-white/95 rounded-xl px-2', '')
          page.write_text(text, encoding='utf-8')

          # Explicit favicon references to the new icon.
          layout = Path('app/layout.tsx')
          text = layout.read_text(encoding='utf-8')
          text = text.replace("icon: 'https://tarkeb-zoogag.com/assets/talal/logo-transparent.webp'", "icon: '/favicon.png'")
          text = text.replace("shortcut: 'https://tarkeb-zoogag.com/assets/talal/logo-transparent.webp'", "shortcut: '/favicon.png'")
          text = text.replace("apple: 'https://tarkeb-zoogag.com/assets/talal/logo-transparent.webp'", "apple: '/favicon.png'")
          layout.write_text(text, encoding='utf-8')
          PY

      - name: Verify replacement
        run: |
          test -s public/assets/talal/logo-transparent.webp
          test -s public/favicon.png
          if grep -n 'https://tarkeb-zoogag.com/assets/talal/logo.webp' app/page.tsx app/layout.tsx 2>/dev/null; then
            echo 'Old logo reference remains in visual files.'
            exit 1
          fi
          grep -q '/assets/talal/logo-transparent.webp' app/page.tsx
          grep -q '/favicon.png' app/layout.tsx

      - name: Build check
        run: |
          npm ci
          npm run build

      - name: Commit final logo replacement
        run: |
          rm -f .github/workflows/apply-talal-logo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply transparent Talal logo and favicon'
          git push
